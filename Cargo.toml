[package]
name = "ctm-parser"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ctm-parser"
path = "src/main.rs"

[lib]
name = "ctm_parser"
path = "src/lib.rs"

[dependencies]
quick-xml = { version = "0.36" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
percent-encoding = "2"

[dev-dependencies]
rstest = "0.23"
